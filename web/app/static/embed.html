<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>leibniz.fm Playlist</title>
<!--
  Iframe fallback, for the case where WordPress strips <script> from a Custom
  HTML block (users without the unfiltered_html capability).

  It is deliberately self-contained and needs ZERO javascript in the embedding
  page - a postMessage auto-resize would require the very <script> tag this
  page exists to work around. So: give the iframe a fixed height and let this
  page scroll internally.

      <iframe src="https://leibniz-fm.lukassanner.de/embed.html?w=now"
              style="width:100%;height:150px;border:0" loading="lazy"
              title="Zuletzt auf leibniz.fm gespielt"></iframe>

  An iframe cannot inherit the host theme, so the look is passed in instead:
    ?w=now|today  &limit=  &interval=  &stations=hide|show  &heading=
    ?fg=          text colour (hex WITHOUT the #, e.g. fg=222222)
    ?accent=      accent colour, same encoding
    ?font=        css font-family stack
  The body stays transparent by default so the parent page's background shows
  through; colours fall back to prefers-color-scheme.
-->
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{
    font-family:var(--lfm-font,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif);
    font-size:15px;line-height:1.45;
    color:#1a1a1a;
    padding:2px 2px 10px;
  }
  @media (prefers-color-scheme:dark){ body{color:#e6e6e6} }
  body[data-fg]{color:var(--lfm-fg)}
</style>
</head>
<body>
<div id="w"></div>
<script>
(function(){
  "use strict";
  var q = new URLSearchParams(location.search);

  // Colours arrive without the leading '#'; only accept plain hex so nothing
  // from the query string can turn into arbitrary CSS.
  function hex(name){
    var v = (q.get(name) || "").replace(/^#/, "");
    return /^[0-9a-fA-F]{3,8}$/.test(v) ? "#" + v : null;
  }

  var fg = hex("fg");
  if (fg){ document.body.style.setProperty("--lfm-fg", fg); document.body.setAttribute("data-fg",""); }

  var accent = hex("accent");
  if (accent) document.body.style.setProperty("--lfm-accent", accent);

  var font = q.get("font");
  // Font stacks are letters, quotes, spaces, commas and hyphens - nothing else.
  if (font && /^[\w\s,'"\-]{1,120}$/.test(font)) document.body.style.setProperty("--lfm-font", font);

  var s = document.createElement("script");
  s.src = "/embed.js";
  s.setAttribute("data-target", "#w");
  s.setAttribute("data-lfm", q.get("w") === "today" ? "today" : "now");
  ["limit", "interval", "stations", "heading"].forEach(function(k){
    var v = q.get(k);
    if (v) s.setAttribute("data-" + (k === "stations" ? "stations" : k), v);
  });
  document.body.appendChild(s);
})();
</script>
</body>
</html>
