services:
  tracker:
    build: ./tracker
    restart: unless-stopped
    environment:
      CONFIG_PATH: /config/config.toml
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:-}
    volumes:
      - ./config.toml:/config/config.toml:ro
      - tracker-data:/data
    networks: [internal]
    # deliberately no `ports:` — tracker is reachable only from `web` on the internal network

  web:
    build: ./web
    restart: unless-stopped
    environment:
      TRACKER_API_URL: http://tracker:8000
    depends_on:
      tracker:
        condition: service_healthy
    networks: [internal]
    # no `ports:` — only reachable from `caddy` on the internal network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"     # required for Let's Encrypt's HTTP-01 challenge + HTTP->HTTPS redirect
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificates - keep this volume to avoid Let's Encrypt rate limits
      - caddy-config:/config
    depends_on:
      - web
    networks: [internal]

networks:
  internal: {}

volumes:
  tracker-data: {}
  caddy-data: {}
  caddy-config: {}
